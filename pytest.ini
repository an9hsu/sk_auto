[pytest]
# setup for Chinese character
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

addopts = --import-mode=importlib --alluredir=allure-results
pythonpath = .
testpaths = tests

# Live Logging in terminal
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_level = DEBUG

markers =
    # 產品
    travel: 旅遊險（國外旅平險＋不便險）
    # 跑的時機
    smoke_test
    regression
    # 需要人工介入（例如圖形驗證碼），必須加 --headed 執行
    requires_headed
